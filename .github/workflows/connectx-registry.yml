name: ConnectX Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/connectx-registry.yml
      - src/ApiServices/ConnectX.Api/**
      - src/ApiServices/ConnectX.Api.Services/**
      - src/ApiServices/ConnectX.Api.Ef/**
      - src/WebServices/ConnectX.Web/**
      - src/WebServices/ConnectX.Web.Services/**
      - src/WebServices/ConnectX.Web.Gateway/**
      - src/Common/ConnectX.Domain/**
      - src/Common/ConnectX.ServiceDefaults/**

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BUILD_CONTEXT: src

jobs:
  build-and-push:
    name: Build and push ${{ matrix.title }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: ConnectX.Api
            image_name: connectx-api
            description: ConnectX API service
            project_path: src/ApiServices/ConnectX.Api/ConnectX.Api.csproj
            dockerfile: src/ApiServices/ConnectX.Api/Dockerfile
          - title: ConnectX.Web
            image_name: connectx-web
            description: ConnectX web application
            project_path: src/WebServices/ConnectX.Web/ConnectX.Web.csproj
            dockerfile: src/WebServices/ConnectX.Web/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "${{ matrix.project_path }}"

      - name: Build
        run: dotnet build "${{ matrix.project_path }}" --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Resolve image metadata
        id: metadata
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image_name }}
          PROJECT_PATH: ${{ matrix.project_path }}
        run: |
          version="$(dotnet msbuild "$PROJECT_PATH" -getProperty:Version -nologo | tr -d '\r' | tail -n 1)"
          if [ -z "$version" ]; then
            echo "Unable to resolve project Version from $PROJECT_PATH." >&2
            exit 1
          fi

          image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          short_sha="${GITHUB_SHA::12}"

          {
            echo "image=$image"
            echo "version=$version"
            echo "tags<<EOF"
            echo "$image:$version"
            echo "$image:sha-$short_sha"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            BUILD_CONFIGURATION=Release
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
