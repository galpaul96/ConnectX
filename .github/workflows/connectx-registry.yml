name: ConnectX Web Registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: connectx-web-image-publish
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: connectx-web

jobs:
  build-and-push:
    name: Build and push ConnectX Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: version
        uses: actions/github-script@v9
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const timeZone = "Europe/Bucharest";
            const dateParts = new Intl.DateTimeFormat("en-GB", {
              timeZone,
              day: "2-digit",
              month: "2-digit",
              year: "2-digit",
            }).formatToParts(new Date());
            const datePart = (type) => dateParts.find((part) => part.type === type).value;
            const date = `${datePart("day")}${datePart("month")}${datePart("year")}`;

            const ownerType = context.payload.repository.owner.type;
            const route = ownerType === "Organization"
              ? "GET /orgs/{org}/packages/{package_type}/{package_name}/versions"
              : "GET /user/packages/{package_type}/{package_name}/versions";
            const params = {
              package_type: "container",
              package_name: process.env.IMAGE_NAME,
              per_page: 100,
              ...(ownerType === "Organization" ? { org: context.repo.owner } : {}),
            };

            let packageVersions = [];
            try {
              packageVersions = await github.paginate(route, params);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const dateTag = new RegExp(`^${date}\\.(\\d+)$`);
            let latestBuildNumber = 0;
            for (const packageVersion of packageVersions) {
              for (const tag of packageVersion.metadata?.container?.tags ?? []) {
                const match = tag.match(dateTag);
                if (match) latestBuildNumber = Math.max(latestBuildNumber, Number(match[1]));
              }
            }

            const version = `${date}.${latestBuildNumber + 1}`;
            const image = `${process.env.REGISTRY}/${context.repo.owner.toLowerCase()}/${process.env.IMAGE_NAME}`;
            const tags = [
              `${image}:${version}`,
              `${image}:sha-${context.sha.slice(0, 12)}`,
              ...(context.ref === "refs/heads/main" ? [`${image}:latest`] : []),
            ];

            core.setOutput("version", version);
            core.setOutput("tags", tags.join("\n"));
            core.info(`Publishing ${image}:${version}`);

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/ConnectX.Web/Dockerfile
          push: true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ConnectX Web
            org.opencontainers.image.description=ConnectX Web application
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
